<!DOCTYPE html>

<body>
    <div class="animated-bg"></div>

    <header class="navbar">
        <div class="nav-container">
            <!-- اللوجو (يمين) -->
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Logo" class="logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/681/681494.png'">
                <span>Back Store</span>
            </a>

            <!-- الكبسولة العائمة (وسط) -->
            <nav class="nav-capsule">
                <a href="index.html" class="nav-link active"><i class="fa-solid fa-house"></i> الرئيسية</a>

            <a href="store.html" class="btn-action" style="text-decoration: none; display: inline-block;">
