<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back Store - تسجيل الدخول</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <div class="login-card">
            <div class="card-header">
                <img src="logo.png" alt="Logo" class="login-logo">
                <h2>تسجيل الدخول</h2>
                <p>مرحباً بك مجدداً في Back Store</p>
            </div>

            <div class="alert-box">
                <i class="fa-solid fa-circle-info"></i>
                <span>تنبيه: يجب أن تكون متواجدًا في سيرفر الديسكورد تصلك الرسائل.</span>
            </div>

            <form id="step-1-form">
                <div class="input-field">
                    <label for="discord-username">اسم المستخدم في الديسكورد (Username)</label>
                    <div class="input-wrapper">
                        <i class="fa-brands fa-discord"></i>
                        <input type="text" id="discord-username" placeholder="username" required autocomplete="off">
                    </div>
                </div>
                <button type="submit" class="btn-submit">إرسال كود التحقق</button>
            </form>

            <form id="step-2-form" style="display: none;">
                <div class="input-field">
                    <label for="verify-code">كود التحقق الخاص بك</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="text" id="verify-code" placeholder="1234" required autocomplete="off">
                    </div>
                </div>
                <button type="submit" class="btn-submit btn-confirm">تأكيد الدخول</button>
            </form>

            <div id="status-message" class="status-msg"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
